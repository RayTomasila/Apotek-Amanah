<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun</title>

    <link rel="stylesheet" href="../public/css/general.css">
    <link rel="stylesheet" href="../public/css/admin/navbar.css">
    <link rel="stylesheet" href="../public/css/admin/akun.css">

    <script async src="../public/js/admin.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="topNav">
      <li><a href="#">Admin</a></li>
        <li>
          <a href="#">
            <img src="../public/assets/admin/navbar/admin-icon.png" alt="Logo">
          </a>
        </li>
    </div>

    <div class="sidebar">
      <div id="sidebar-arrow" class="sidebar-arrow">
        <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="15" r="14" class="circle"/>
          <g class="arrow-group">
            <path d="M11 23.5L20.5 15L11 7" class="arrow"/>
          </g>
        </svg>
      </div>      

      <div class="sidebar-logo">
        <a href="#dashboard">
        <img src="../public/assets/admin/navbar/logo-hijau.png" alt="Logo">
        </a><span>Apotek Amanah</span> 
      </div>

      <ul>
        <li>
          <a href="dashboard.html" class="sideLinkToggle">
            <img src="../public/assets/admin/navbar/dashboard-icon.png" alt="">
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="produk.html" class="sideLinkToggle">
            <img src="../public/assets/admin/navbar/produk-icon.png" alt="">
            <span>Produk</span>
          </a>
        </li>
        <li>
          <a href="transaksi.html" class="sideLinkToggle">
            <img src="../public/assets/admin/navbar/transaksi-icon.png" alt="">
            <span>Transaksi</span>
          </a>
        </li>
        <li>
          <a href="transaksi.html" class="sideLinkToggle">
            <img src="../public/assets/admin/navbar/laporan-icon.png" alt="">            
            <span>Laporan Transaksi</span>
          </a>
        </li>
      </ul>
      
      
    </div>
  </nav>

  <main class="container" id="main-content">
    <div class="login">
      <div class="form-login">
        <div class="form-left">
          <div class="logout-button-container">
            <a class="logout-button" onclick="window.location.href='login.html'">
              <img src="../public/assets/admin/akun/logout-icon.png" alt="">
              Log out
            </a>
          </div>
          <img src="../public/assets/admin/login/login-left-image.png" alt="">
        </div>
    
        <div class="form-right">
          <div class="logo">
            <img src="../public/assets/admin/login/logo-putih.png" alt="Logo">
            <p class="amanah-logo-text">Amanah</p>
            <p class="logo-text">Ubah Akun Anda</p>
          </div>
    
          <form class="form-input">
            <div class="input-container">
              <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                  <img src="../public/assets/admin/login/username-icon.png" alt="User Icon">
                  <input type="text" id="username" name="username" placeholder="Admin">
                </div>
              </div>
    
              <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                  <img src="../public/assets/admin/login/password-icon.png" alt="password Icon">
                  <input type="password" id="password" name="password" placeholder="Admin">
                </div>
              </div>
            </div>
    
            <a class="form-button" onclick="window.location.href='dashboard.html'">Simpan</a>
          </form>
    
        </div>
      </div>
    </div>
  </main>


</body>
</html>
